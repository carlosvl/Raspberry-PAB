[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raspberry-pab"
version = "0.1.0"
description = "Fullscreen kiosk application for Raspberry Pi OS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Villalpando" }]
keywords = ["raspberry-pi", "raspberry-pi-os", "kiosk"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[project.scripts]
raspberry-pab = "raspberry_pab.cli:main"

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["raspberry_pab"]
mypy_path = "src"
