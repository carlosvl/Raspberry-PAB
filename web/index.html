<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#38bdf8" />
    <title>Raspberry-PAB</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/pab-icon-180.png" />
    <link rel="stylesheet" href="/css/kiosk.css" />
  </head>
  <body>
    <main class="kiosk">
      <header class="kiosk__header">
        <div class="kiosk__brand" id="adminBrandTrigger">
          <img alt="" class="kiosk__logo" hidden id="kioskLogo" />
          <div>
            <h1 class="kiosk__title" id="kioskTitle">Raspberry-PAB</h1>
            <p class="kiosk__subtitle" id="eventDate">Today</p>
          </div>
        </div>
        <p class="kiosk__clock" id="controlHotspot" title="Hold for controls">--:--:--</p>
      </header>

      <section class="kiosk__content">
        <table class="schedule" aria-label="Start schedule">
          <thead>
            <tr>
              <th>Name</th>
              <th>Race</th>
              <th>Call Up</th>
              <th>Start Time</th>
              <th>Countdown</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr>
              <td colspan="6">Loading schedule…</td>
            </tr>
          </tbody>
        </table>
        <p class="kiosk__status" id="status">Connecting…</p>
        <p class="kiosk__remote" id="remoteInfo">Remote access checking…</p>
      </section>
    </main>

    <section class="alert" id="alertOverlay" aria-live="assertive" hidden>
      <div class="alert__card">
        <p class="alert__eyebrow">Reminder</p>
        <h2 class="alert__message" id="alertMessage"></h2>
        <p class="alert__meta" id="alertMeta"></p>
        <button class="alert__button" id="dismissAlert" type="button">Dismiss</button>
      </div>
    </section>

    <section class="control-menu" id="controlMenu" aria-live="polite" hidden>
      <div class="control-menu__card">
        <p class="control-menu__eyebrow">Kiosk Controls</p>
        <h2>What do you want to do?</h2>
        <div class="control-menu__actions">
          <button class="control-menu__button" id="reloadApp" type="button">
            Reload App
          </button>
          <button class="control-menu__button" id="exitKiosk" type="button">
            Exit Kiosk
          </button>
          <button class="control-menu__button control-menu__button--secondary" id="closeMenu" type="button">
            Cancel
          </button>
        </div>
      </div>
    </section>

    <section class="ff-toolbar" id="ffToolbar" hidden>
      <button class="ff-toolbar__button" id="ffBack" type="button" title="Back to Test Lab">← Test Lab</button>
      <button class="ff-toolbar__button ff-toolbar__button--ff" id="ffAdvance" type="button" title="Tap +1 min · Hold to fast-forward">⏩ +1 min</button>
      <span class="ff-toolbar__clock" id="ffClock">--:--:--</span>
    </section>

    <script src="/js/button-feedback.js"></script>
    <script src="/js/kiosk.js"></script>
  </body>
</html>
