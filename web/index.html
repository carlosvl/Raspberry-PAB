<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Raspberry-PAB</title>
    <link rel="stylesheet" href="/css/kiosk.css" />
  </head>
  <body>
    <main class="kiosk">
      <header class="kiosk__header" id="adminHotspot" title="Hold for controls">
        <div>
          <h1 class="kiosk__title">Raspberry-PAB</h1>
          <p class="kiosk__subtitle" id="eventDate">Today</p>
        </div>
        <p class="kiosk__clock" id="clock">--:--:--</p>
      </header>

      <section class="kiosk__content">
        <table class="schedule" aria-label="Start schedule">
          <thead>
            <tr>
              <th>Name</th>
              <th>Date</th>
              <th>Start</th>
              <th>Time to Start</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr>
              <td colspan="4">Loading schedule…</td>
            </tr>
          </tbody>
        </table>
        <p class="kiosk__status" id="status">Connecting…</p>
      </section>
    </main>

    <section class="alert" id="alertOverlay" aria-live="assertive" hidden>
      <div class="alert__card">
        <p class="alert__eyebrow">Reminder</p>
        <h2 class="alert__message" id="alertMessage"></h2>
        <p class="alert__meta" id="alertMeta"></p>
        <button class="alert__button" id="dismissAlert" type="button">Dismiss</button>
      </div>
    </section>

    <section class="control-menu" id="controlMenu" aria-live="polite" hidden>
      <div class="control-menu__card">
        <p class="control-menu__eyebrow">Kiosk Controls</p>
        <h2>What do you want to do?</h2>
        <div class="control-menu__actions">
          <a class="control-menu__button" href="/admin">Admin</a>
          <button class="control-menu__button" id="reloadApp" type="button">
            Reload App
          </button>
          <button class="control-menu__button" id="exitKiosk" type="button">
            Exit Kiosk
          </button>
          <button class="control-menu__button control-menu__button--secondary" id="closeMenu" type="button">
            Cancel
          </button>
        </div>
      </div>
    </section>

    <script src="/js/kiosk.js"></script>
  </body>
</html>
