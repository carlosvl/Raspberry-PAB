<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#38bdf8" />
    <title>Raspberry-PAB Admin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/pab-icon-180.png" />
    <link rel="stylesheet" href="/css/kiosk.css" />
  </head>
  <body class="admin-page">
    <main class="admin">
      <header class="admin__header" id="adminHeader" hidden>
        <div>
          <h1>Schedule Admin</h1>
          <p>Manage offline starts and reminder rules.</p>
          <p class="admin__remote" id="remoteInfo">Remote access checking…</p>
        </div>
        <div class="admin__header-actions">
          <button class="admin__link" data-open-keyboard type="button">Keyboard</button>
          <a class="admin__link" href="/">Back to Kiosk</a>
        </div>
      </header>

      <nav class="admin__nav" id="adminNav" aria-label="Admin sections" hidden>
        <button data-scroll-target="participantsPanel" type="button">
          Participants
        </button>
        <button data-scroll-target="rulesPanel" type="button">
          Rules
        </button>
        <button data-scroll-target="importPanel" type="button">
          Import / Export
        </button>
        <a href="/">Kiosk</a>
      </nav>

      <section class="admin__pin" id="pinPanel">
        <label>
          Admin PIN
          <input id="pinInput" inputmode="numeric" type="password" />
        </label>
        <button id="savePin" type="button">Unlock</button>
        <button data-open-keyboard type="button">Keyboard</button>
        <p class="admin__pin-message" id="pinMessage" aria-live="polite"></p>
      </section>

      <section class="admin__grid" id="adminPanels" hidden>
        <article class="panel" id="participantsPanel">
          <h2>Participants</h2>
          <form class="form" id="participantForm">
            <input id="participantId" type="hidden" />
            <label>
              Name
              <input id="participantName" required />
            </label>
            <label>
              Date
              <input id="participantDate" required type="date" />
            </label>
            <label>
              Start Time
              <input id="participantTime" required type="time" />
            </label>
            <button type="submit">Save Participant</button>
            <button id="clearParticipant" type="button">Clear</button>
          </form>
          <div class="admin__list" id="participantList"></div>
        </article>

        <article class="panel" id="rulesPanel">
          <h2>Reminder Rules</h2>
          <form class="form" id="ruleForm">
            <input id="ruleId" type="hidden" />
            <label>
              Offset Minutes
              <input id="ruleOffset" min="0" required type="number" />
            </label>
            <label>
              Message Template
              <input id="ruleMessage" placeholder="Warm Up {name}" required />
            </label>
            <label>
              Repeat Every Minutes
              <input id="ruleRepeat" min="1" type="number" />
            </label>
            <label class="checkbox">
              <input id="ruleEnabled" checked type="checkbox" />
              Enabled
            </label>
            <button type="submit">Save Rule</button>
            <button id="clearRule" type="button">Clear</button>
          </form>
          <div class="admin__list" id="ruleList"></div>
        </article>

        <article class="panel panel--wide" id="importPanel">
          <h2>Import / Export</h2>
          <div class="form">
            <label>
              Event Date
              <input id="importDate" type="date" />
            </label>
            <label>
              Paste Schedule JSON
              <textarea id="importJson" rows="10"></textarea>
            </label>
            <div class="button-row">
              <button id="importSchedule" type="button">Import JSON</button>
              <button id="exportSchedule" type="button">Export Selected Date</button>
            </div>
          </div>
          <pre class="admin__output" id="adminOutput"></pre>
        </article>
      </section>
    </main>
    <script src="/js/admin.js"></script>
  </body>
</html>
